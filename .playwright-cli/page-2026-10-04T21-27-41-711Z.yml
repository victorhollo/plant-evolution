                  - time [ref=f8e82]: ~1 billion years ago
                - 'heading "Origins: green algae and the first photosynthesizers" [level=3] [ref=f8e83]'
                - paragraph [ref=f8e84]: "Photosynthesis began in bacteria: cyanobacteria were making sugar from sunlight and releasing oxygen billions of years before plants existed. More than a billion years ago, a larger cell swallowed a cyanobacterium but did not digest it. It became the chloroplast, and the descendants of that cell include all green algae and plants."
                - paragraph [ref=f8e85]: Green algae evolved in the sea and in fresh water. One freshwater group, the charophytes, is the closest living relative of land plants. Early plant history leaves few fossils, so these dates vary between studies.
                - generic [ref=f8e86]:
                  - generic [ref=f8e87]:
                    - heading "Key adaptations" [level=4] [ref=f8e88]
                    - list [ref=f8e89]:
                      - listitem [ref=f8e90]: Chloroplasts
                      - listitem [ref=f8e91]: Chlorophyll a and b
                      - listitem [ref=f8e92]: Cellulose cell walls
                      - listitem [ref=f8e93]: Starch for energy storage
                  - generic [ref=f8e94]:
                    - heading "Example species" [level=4] [ref=f8e95]
                    - list [ref=f8e96]:
                      - listitem [ref=f8e97]: Chara – stonewort
                      - listitem [ref=f8e98]: Spirogyra – filamentous green alga
                      - listitem [ref=f8e99]: Volvox – colonial green alga
                      - listitem [ref=f8e100]: Ulva – sea lettuce
                - paragraph [ref=f8e101]: "Estimates vary: the plant lineage may be about 1.5 billion years old, while clear green algae fossils are around 750 million years old."
            - article [ref=f8e102]:
              - generic [aria-hidden]:
