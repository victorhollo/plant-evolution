                  - time [ref=f8e133]: ~420 million years ago
                - 'heading "Vascular plants: xylem, phloem, ferns and lycophytes" [level=3] [ref=f8e134]'
                - paragraph [ref=f8e135]: In the Silurian and Devonian periods, some plants gained internal plumbing. Xylem carries water up from the roots, and phloem carries sugars to where they are needed. Cooksonia, only a few centimetres tall, is one of the earliest known vascular plants.
                - paragraph [ref=f8e136]: Lignin stiffened the walls of xylem cells, so plants could grow tall. Roots anchored them and reached deeper water. By the Carboniferous, forests of giant lycophytes, horsetails and tree ferns covered wet lowlands, and their buried remains became much of today’s coal.
                - generic [ref=f8e137]:
                  - generic [ref=f8e138]:
                    - heading "Key adaptations" [level=4] [ref=f8e139]
                    - list [ref=f8e140]:
                      - listitem [ref=f8e141]: Xylem and phloem
