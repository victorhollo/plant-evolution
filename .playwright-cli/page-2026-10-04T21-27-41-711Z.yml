                    - list [ref=f8e148]:
                      - listitem [ref=f8e149]: Cooksonia – early fossil plant
                      - listitem [ref=f8e150]: Lycopodium clavatum – stag’s-horn clubmoss
                      - listitem [ref=f8e151]: Equisetum – horsetails
                      - listitem [ref=f8e152]: Pteridium aquilinum – bracken
                      - listitem [ref=f8e153]: Lepidodendron – extinct giant lycophyte
            - article [ref=f8e154]:
              - generic [aria-hidden]:
                - generic: "370"
              - figure [aria-hidden] [ref=f8e155]
              - generic [ref=f8e157]:
                - paragraph [ref=f8e158]:
                  - generic [ref=f8e159]: Stage 4
                  - time [ref=f8e160]: ~370 million years ago
                - 'heading "Seeds: gymnosperms, conifers and cycads" [level=3] [ref=f8e161]'
                - paragraph [ref=f8e162]: A seed packs a tiny embryo and a food store inside a protective coat. It can wait for good conditions before it sprouts. Seed plants also make pollen, which the wind carries to the egg, so fertilisation no longer needs water.
                - paragraph [ref=f8e163]: The first seed plants appeared in the late Devonian. Conifers followed around 300 million years ago, and gymnosperms (“naked seeds”, not enclosed in a fruit) such as conifers, cycads and ginkgos dominated the age of the dinosaurs. Conifers still cover much of the northern world, including Finland.
                - generic [ref=f8e164]:
                  - generic [ref=f8e165]:
                    - heading "Key adaptations" [level=4] [ref=f8e166]
                    - list [ref=f8e167]:
                      - listitem [ref=f8e168]: Seeds
                      - listitem [ref=f8e169]: Pollen
                      - listitem [ref=f8e170]: Wood (growth in thickness)
                      - listitem [ref=f8e171]: Needle leaves with a thick cuticle
                  - generic [ref=f8e172]:
                    - heading "Example species" [level=4] [ref=f8e173]
                    - list [ref=f8e174]:
                      - listitem [ref=f8e175]: Pinus sylvestris – Scots pine
                      - listitem [ref=f8e176]: Picea abies – Norway spruce
                      - listitem [ref=f8e177]: Ginkgo biloba – ginkgo
                      - listitem [ref=f8e178]: Cycas revoluta – sago palm (a cycad)
                - paragraph [ref=f8e179]: Often rounded to 360 million years. The oldest seed fossils are from the late Devonian, roughly 370–360 million years ago.
            - article [ref=f8e180]:
              - generic [aria-hidden]:
                - generic: "130"
              - figure [aria-hidden] [ref=f8e181]
              - generic [ref=f8e183]:
                - paragraph [ref=f8e184]:
                  - generic [ref=f8e185]: Stage 5
                  - time [ref=f8e186]: ~130 million years ago
                - 'heading "Flowers: angiosperms and their pollinators" [level=3] [ref=f8e187]'
                - paragraph [ref=f8e188]: Flowering plants (angiosperms) appear in the fossil record in the Early Cretaceous, around 130 million years ago. Their seeds develop inside an ovary, which ripens into a fruit.
                - paragraph [ref=f8e189]: Petals, scent and nectar attract insects that carry pollen straight from flower to flower, wasting far less pollen than the wind does. Flowers and pollinators shaped each other over millions of years (coevolution), and fruits recruited animals to spread seeds. Today roughly nine in ten plant species are flowering plants.
                - generic [ref=f8e190]:
                  - generic [ref=f8e191]:
                    - heading "Key adaptations" [level=4] [ref=f8e192]
                    - list [ref=f8e193]:
                      - listitem [ref=f8e194]: Flowers
                      - listitem [ref=f8e195]: Ovary and fruit
                      - listitem [ref=f8e196]: Double fertilisation
                      - listitem [ref=f8e197]: Coevolution with pollinators
                  - generic [ref=f8e198]:
                    - heading "Example species" [level=4] [ref=f8e199]
                    - list [ref=f8e200]:
                      - listitem [ref=f8e201]: Amborella trichopoda – oldest surviving flowering-plant lineage
                      - listitem [ref=f8e202]: Nymphaea – water lilies
                      - listitem [ref=f8e203]: Magnolia – magnolias
                      - listitem [ref=f8e204]: Archaefructus – early fossil flowering plant
                - paragraph [ref=f8e205]: The oldest flower fossils are about 140–130 million years old. DNA studies suggest the group may be older still.
            - article [ref=f8e206]:
              - generic [aria-hidden]:
                - generic: "50"
              - figure [aria-hidden] [ref=f8e207]
              - generic [ref=f8e209]:
                - paragraph [ref=f8e210]:
                  - generic [ref=f8e211]: Stage 6
                  - time [ref=f8e212]: ~50 to 20 million years ago
                - heading "The rise of grasses and modern ecosystems" [level=3] [ref=f8e213]
                - paragraph [ref=f8e214]: Grasses first evolved in the Late Cretaceous, alongside the last dinosaurs, but for a long time they were a minor part of the vegetation. As Earth’s climate cooled and dried from about 50 million years ago, they spread, and by roughly 30–20 million years ago open grasslands covered large areas of several continents.
                - paragraph [ref=f8e215]: "Grasses grow from the base of the leaf, so grazing or fire rarely kills them. Many later evolved C4 photosynthesis, which works well in heat and drought. Grazing mammals such as horses evolved high-crowned teeth and long legs for open plains: another example of coevolution."
                - generic [ref=f8e216]:
                  - generic [ref=f8e217]:
                    - heading "Key adaptations" [level=4] [ref=f8e218]
                    - list [ref=f8e219]:
                      - listitem [ref=f8e220]: Growth from the leaf base
                      - listitem [ref=f8e221]: Silica in leaves
                      - listitem [ref=f8e222]: C4 photosynthesis
                      - listitem [ref=f8e223]: Wind pollination
                  - generic [ref=f8e224]:
                    - heading "Example species" [level=4] [ref=f8e225]
                    - list [ref=f8e226]:
                      - listitem [ref=f8e227]: Festuca – fescues
                      - listitem [ref=f8e228]: Phragmites australis – common reed
                      - listitem [ref=f8e229]: Bambusa – bamboo
                      - listitem [ref=f8e230]: Andropogon gerardii – big bluestem, a prairie grass
                - paragraph [ref=f8e231]: The oldest grass fossils are from the Late Cretaceous, over 66 million years ago. The ~50 million year mark is when the cooling that helped grasses spread began.
            - article [ref=f8e232]:
              - generic [aria-hidden]:
                - generic: 10,000
              - figure [aria-hidden] [ref=f8e233]
              - generic [ref=f8e235]:
                - paragraph [ref=f8e236]:
                  - generic [ref=f8e237]: Stage 7
                  - time [ref=f8e238]: ~10,000 years ago
                - 'heading "Humans and agriculture: domesticating crops" [level=3] [ref=f8e239]'
                - paragraph [ref=f8e240]: As the last ice age ended, people in several parts of the world began to grow plants instead of only gathering them. In the Fertile Crescent of the Middle East, wheat, barley, peas and lentils were among the first crops, around 10,000 years ago. Rice, maize, potatoes and others were domesticated independently elsewhere.
                - paragraph [ref=f8e241]: "Farmers sowed seeds from the best plants, and over generations crops changed: bigger grains, seed heads that do not shatter, less bitterness. This is artificial selection, evolution steered by people. Farming made settled villages and cities possible and has reshaped landscapes across the planet."
                - generic [ref=f8e242]:
                  - generic [ref=f8e243]:
                    - heading "Key adaptations" [level=4] [ref=f8e244]
                    - list [ref=f8e245]:
                      - listitem [ref=f8e246]: Artificial selection
                      - listitem [ref=f8e247]: Non-shattering seed heads
                      - listitem [ref=f8e248]: Larger seeds and fruits
                      - listitem [ref=f8e249]: Polyploidy (e.g. bread wheat)
                  - generic [ref=f8e250]:
                    - heading "Example species" [level=4] [ref=f8e251]
                    - list [ref=f8e252]:
                      - listitem [ref=f8e253]: Triticum aestivum – bread wheat
                      - listitem [ref=f8e254]: Hordeum vulgare – barley
                      - listitem [ref=f8e255]: Oryza sativa – rice
                      - listitem [ref=f8e256]: Zea mays – maize, bred from teosinte
                      - listitem [ref=f8e257]: Solanum tuberosum – potato
