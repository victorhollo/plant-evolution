                  - generic [ref=f8e107]: Stage 2
                  - time [ref=f8e108]: ~470 million years ago
                - 'heading "Colonization of land: mosses and liverworts" [level=3] [ref=f8e109]'
                - paragraph [ref=f8e110]: The first land plants left behind tiny spores in Ordovician rocks. They were small and low and lived in damp places, much like today’s mosses, liverworts and hornworts (the bryophytes).
                - paragraph [ref=f8e111]: Land offered plenty of light and carbon dioxide, but also the danger of drying out. Early land plants evolved a waxy cuticle and relied on fungi to gather minerals. Their sperm still had to swim through water to reach the egg, so they stayed close to the ground.
                - generic [ref=f8e112]:
                  - generic [ref=f8e113]:
                    - heading "Key adaptations" [level=4] [ref=f8e114]
                    - list [ref=f8e115]:
                      - listitem [ref=f8e116]: Cuticle
                      - listitem [ref=f8e117]: Tough-walled spores (sporopollenin)
                      - listitem [ref=f8e118]: Partnerships with fungi
                      - listitem [ref=f8e119]: Gametophyte-dominant life cycle
                  - generic [ref=f8e120]:
                    - heading "Example species" [level=4] [ref=f8e121]
                    - list [ref=f8e122]:
                      - listitem [ref=f8e123]: Marchantia polymorpha – common liverwort
                      - listitem [ref=f8e124]: Sphagnum – peat moss
                      - listitem [ref=f8e125]: Polytrichum – haircap moss
                      - listitem [ref=f8e126]: Anthoceros – hornwort
            - article [ref=f8e127]:
              - generic [aria-hidden]:
