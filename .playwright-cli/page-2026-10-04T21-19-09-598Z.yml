                - 'heading "Kukat: koppisiemeniset ja pölyttäjät" [level=3] [ref=e197]'
                - paragraph [ref=e198]: Kukkakasvit eli koppisiemeniset ilmestyvät fossiiliaineistoon varhaisella liitukaudella, noin 130 miljoonaa vuotta sitten. Niiden siemenet kehittyvät sikiäimen sisällä, ja sikiäin kypsyy hedelmäksi.
                - paragraph [ref=e199]: Terälehdet, tuoksu ja mesi houkuttelevat hyönteisiä, jotka kuljettavat siitepölyä suoraan kukasta toiseen. Siitepölyä menee hukkaan paljon vähemmän kuin tuulipölytyksessä. Kukat ja pölyttäjät muokkasivat toisiaan miljoonien vuosien ajan (koevoluutio), ja hedelmät saivat eläimet levittämään siemeniä. Nykyään noin yhdeksän kasvilajia kymmenestä on koppisiemenisiä.
