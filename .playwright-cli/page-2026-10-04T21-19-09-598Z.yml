                      - listitem [ref=e187]: Ginkgo biloba – neidonhiuspuu
                      - listitem [ref=e188]: Cycas revoluta – japaninkävypalmu
                - paragraph [ref=e189]: Ajankohta pyöristetään usein 360 miljoonaan vuoteen. Vanhimmat siemenfossiilit ovat devonikauden lopulta, noin 370–360 miljoonan vuoden takaa.
            - article [ref=e190]:
