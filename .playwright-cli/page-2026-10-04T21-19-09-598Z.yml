                      - listitem [ref=e238]: Phragmites australis – järviruoko
                      - listitem [ref=e239]: Bambusa – bambu
                      - listitem [ref=e240]: Andropogon gerardii – preeriaheinä
                - paragraph [ref=e241]: Vanhimmat heinäfossiilit ovat liitukauden lopulta, yli 66 miljoonan vuoden takaa. Noin 50 miljoonaa vuotta sitten alkoi viileneminen, joka auttoi heiniä leviämään.
