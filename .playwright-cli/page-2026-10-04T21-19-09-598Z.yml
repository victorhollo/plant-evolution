                - heading "Heinien nousu ja nykyiset ekosysteemit" [level=3] [ref=e223]
                - paragraph [ref=e224]: Heinät kehittyivät jo liitukauden lopulla viimeisten dinosaurusten aikaan, mutta pitkään ne olivat kasvillisuudessa vähäisiä. Kun ilmasto alkoi viiletä ja kuivua noin 50 miljoonaa vuotta sitten, heinät levittäytyivät, ja noin 30–20 miljoonaa vuotta sitten avoimet ruohoalueet peittivät laajoja alueita useilla mantereilla.
                - paragraph [ref=e225]: Heinät kasvavat lehden tyvestä, joten laidunnus tai tuli tappaa ne harvoin. Monille kehittyi myöhemmin C4-yhteyttäminen, joka toimii hyvin kuumuudessa ja kuivuudessa. Laiduntaville nisäkkäille, kuten hevosille, kehittyi korkeat hampaat ja pitkät jalat avoimille tasangoille. Tämäkin on koevoluutiota.
