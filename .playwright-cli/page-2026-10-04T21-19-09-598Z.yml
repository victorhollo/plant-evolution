                - 'heading "Maalle nousu: sammalet ja maksasammalet" [level=3] [ref=e119]'
                - paragraph [ref=e120]: Ensimmäiset maakasvit jättivät jälkeensä pieniä itiöitä ordovikikauden kivilajeihin. Ne olivat pieniä ja matalia ja elivät kosteissa paikoissa, kuten nykyiset sammalet, maksasammalet ja sarvisammalet.
                - paragraph [ref=e121]: Maalla oli runsaasti valoa ja hiilidioksidia, mutta myös kuivumisen vaara. Varhaisille maakasveille kehittyi vahamainen kutikula, ja kivennäisaineiden saannissa ne turvautuivat sieniin. Siittiöiden piti yhä uida veden läpi munasolun luo, joten kasvit pysyivät lähellä maanpintaa.
