                - 'heading "Putkilokasvit: puu- ja nilaosa, saniaiset ja liekokasvit" [level=3] [ref=e144]'
                - paragraph [ref=e145]: Siluuri- ja devonikaudella osalle kasveista kehittyi sisäinen putkisto. Puuosa (ksyleemi) kuljettaa vettä juurista ylös, ja nilaosa (floeemi) vie sokereita sinne, missä niitä tarvitaan. Vain muutaman senttimetrin korkuinen Cooksonia on yksi varhaisimmista tunnetuista putkilokasveista.
                - paragraph [ref=e146]: Ligniini jäykisti puuosan soluseiniä, joten kasvit pystyivät kasvamaan korkeiksi. Juuret ankkuroivat ne ja ulottuivat syvemmälle veteen. Kivihiilikaudella jättimäisten liekokasvien, korteiden ja puusaniaisten metsät peittivät kosteita alankoja, ja niiden hautautuneista jäänteistä syntyi suuri osa nykyisestä kivihiilestä.
