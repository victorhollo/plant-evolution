                - 'heading "Siemenet: paljassiemeniset, havupuut ja kävypalmut" [level=3] [ref=e171]'
                - paragraph [ref=e172]: Siemenessä on pieni alkio ja ravintovarasto suojaavan kuoren sisällä. Se voi odottaa sopivia oloja ennen itämistä. Siemenkasvit tuottavat myös siitepölyä, jonka tuuli kuljettaa munasolun luo, joten hedelmöitys ei enää vaadi vettä.
                - paragraph [ref=e173]: Ensimmäiset siemenkasvit ilmestyivät devonikauden lopulla. Havupuut seurasivat noin 300 miljoonaa vuotta sitten, ja paljassiemeniset (siemen ei ole hedelmän sisällä), kuten havupuut, kävypalmut ja neidonhiuspuut, hallitsivat dinosaurusten aikaa. Havupuut peittävät yhä suuren osan pohjoista maailmaa, myös Suomea.
