                      - listitem [ref=e109]: Volvox – yhdyskuntaviherlevä
                      - listitem [ref=e110]: Ulva – merisalaatti
                - paragraph [ref=e111]: "Arviot vaihtelevat: kasvien kantalinja voi olla noin 1,5 miljardia vuotta vanha, kun taas selvät viherlevien fossiilit ovat noin 750 miljoonaa vuotta vanhoja."
