                - 'heading "Alkuperä: viherlevät ja ensimmäiset yhteyttäjät" [level=3] [ref=e93]'
                - paragraph [ref=e94]: "Yhteyttäminen alkoi bakteereista: sinibakteerit valmistivat sokeria auringonvalon avulla ja vapauttivat happea miljardeja vuosia ennen kasveja. Yli miljardi vuotta sitten suurempi solu nieli sinibakteerin mutta ei hajottanut sitä. Siitä tuli viherhiukkanen, ja tämän solun jälkeläisiä ovat kaikki viherlevät ja kasvit."
                - paragraph [ref=e95]: Viherlevät kehittyivät meressä ja makeassa vedessä. Yksi makean veden ryhmä, näkinpartaislevät, on maakasvien lähin elävä sukulainen. Kasvien varhaishistoriasta on vähän fossiileja, joten ajankohdat vaihtelevat tutkimuksesta toiseen.
