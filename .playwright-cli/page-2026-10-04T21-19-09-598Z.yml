                - 'heading "Ihminen ja maanviljely: viljelykasvien synty" [level=3] [ref=e249]'
                - paragraph [ref=e250]: Viimeisen jääkauden päättyessä ihmiset alkoivat useilla alueilla kasvattaa kasveja sen sijaan, että olisivat vain keränneet niitä. Lähi-idän Hedelmällisen puolikuun alueella vehnä, ohra, herne ja linssi olivat ensimmäisiä viljelykasveja noin 10 000 vuotta sitten. Riisi, maissi, peruna ja monet muut otettiin viljelyyn toisistaan riippumatta muualla.
                - paragraph [ref=e251]: "Viljelijät kylvivät parhaiden kasvien siemeniä, ja sukupolvien mittaan kasvit muuttuivat: jyvät suurenivat, tähkät lakkasivat varisemasta ja kitkeryys väheni. Tämä on keinotekoista valintaa, ihmisen ohjaamaa evoluutiota. Maanviljely mahdollisti pysyvät kylät ja kaupungit, ja se on muuttanut maisemia kaikkialla maapallolla."
